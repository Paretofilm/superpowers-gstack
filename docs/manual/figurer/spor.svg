  <text x="42" y="135" font-size="14" font-weight="600" class="mono">swiftui-design-consultation</text>
  <text x="42" y="152" font-size="12" class="m">DESIGN.md og en Swift-pakke med designsystemet</text>
  <text x="42" y="183" font-size="14" font-weight="600" class="mono">apple-native-review</text>
  <text x="42" y="200" font-size="12" class="m">sjekker spec og plan mot Apples HIG, med sitater</text>
