  <text x="42" y="296" font-size="12" class="m">UI-tester, og bygg og start akkurat denne grenen</text>

  <rect x="488" y="82" width="458" height="236" rx="16" fill="var(--cyan-s)" stroke="var(--cyan)" stroke-width="1.5"/>
