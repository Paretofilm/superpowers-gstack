<svg viewBox="0 0 960 330" role="img" aria-label="To spor som deler samme kjerne. Øverst en felles rad: brainstorming, plan, bygg, bevis, landing. Under til venstre sporet for Swift-apper med fire ekstra deler: swiftui-design-consultation som skriver designsystemet, apple-native-review som sjekker spec og plan mot Apples designretningslinjer, live-swiftui og swiftui-rag som lar Claude se og slå opp SwiftUI uten hele appen, og e2e-route og verify-and-land som tester og viser akkurat denne grenen. Under til høyre sporet for web og Python med fire ekstra deler: qa og qa-only for testing, browse og design-review for å se siden, cso for sikkerhetsrevisjon og investigate for å finne årsaken først">
