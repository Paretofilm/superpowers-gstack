# Prosjektets pre-merge-sperre. Kjøres av `wt merge` etter rebase og før main flyttes.
# Kommandoene er de samme som .github/workflows/lint.yml, og kjører samtidig (tabell).
# `unit` går via scripts/pytest-gate.sh: den bruker python3 når den har pytest og er >= 3.11,
# ellers `uv run --python 3.14 --with pytest`, ellers avslutter den med kode 70 og et råd.
# De to --deselect-testene måler oppstrøms drift (installert gstack/Superpowers mot
# roster og pinne), ikke denne endringen. De kjøres eksplisitt i planens Phase 9.

[pre-merge]
lint = "python3 scripts/lint-skills.py"
unit = "bash scripts/pytest-gate.sh tests/unit -q -p no:cacheprovider --deselect tests/unit/test_lint_upstream_skills.py::test_roster_matches_installed_upstream_when_present --deselect tests/unit/test_spec_drift_upstream_alarm.py::test_pin_matches_installed_gstack_when_present"
contract = "for t in skills/*/tests/required-sections.test.sh; do bash \"$t\" || exit 1; done"
# node_modules finnes ikke i en ny arbeidsmappe; installasjonen fra låsefila tar under ett sekund fra bufferen.
htmlify = "bun install --frozen-lockfile --cwd skills/htmlify >/dev/null && bun test --cwd skills/htmlify"
