name: Lint + unit tests

# Validates skills/, CLAUDE.md and README.md on every push/PR — frontmatter,
# cross-reference resolution, routing coverage, CHANGELOG<->version, marker
# consistency, and the stale-pattern denylist. Free and fast (stdlib python,
# no API calls). Added by the 2026-07-03 system review: 5 700 lines of
# instruction surface previously had zero validation.
#
# Also runs the pytest suites (tests/unit + scripts/cost-ledger) — stdlib-only,
# no API calls. Added by the 2026-07-05 audit: 153 tests previously ran only
# when someone remembered to run them locally.

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint skills + routing + release hygiene
        run: python3 scripts/lint-skills.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python3 -m pip install --quiet pytest
      - name: Unit tests (tests/unit + cost-ledger)
        run: pytest tests/unit scripts/cost-ledger -q
